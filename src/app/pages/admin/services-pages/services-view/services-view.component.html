<h2>Services</h2>
<div class="button-area">
    <button mat-raised-button color="primary" [routerLink]="['./new']">Add Service</button>
</div>
<div class="table-area">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let service"> {{service.Id}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let service"> {{service.Name}} </td>
        </ng-container>

        <!-- Price Range Column -->
        <ng-container matColumnDef="priceRange">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Price Range </th>
            <td mat-cell *matCellDef="let service"> {{service.MinPrice}} - {{service.MaxPrice}} </td>
        </ng-container>

        <!-- Sort Order Column -->
        <ng-container matColumnDef="sortOrder">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Sort Order </th>
            <td mat-cell *matCellDef="let service"> {{service.SortOrder}} </td>
        </ng-container>

        <!-- Edit Button Column -->
        <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef> Edit </th>
            <td mat-cell *matCellDef="let service">
                <button mat-button color="accent" (click)="editService(service.Id)">Edit</button>
            </td>
        </ng-container>

        <!-- Delete Button Column -->
        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef> Delete </th>
            <td mat-cell *matCellDef="let service">
                <button mat-button color="warn" (click)="deleteService(service.Id)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
